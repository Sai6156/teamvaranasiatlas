services:
  - type: web
    name: atlas-varanasi-api
    runtime: docker
    region: singapore
    plan: free
    dockerContext: services/api
    dockerfilePath: services/api/Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_FREE_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Atlas
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RUN_WORKER
        value: "true"
